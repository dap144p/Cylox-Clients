plugins { id 'java' }

group = 'dev.cylox'
version = '1.4.0'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    maven { url 'https://libraries.minecraft.net/' }
    mavenCentral()
}

def viaJava8Libraries = [
    [
        file: layout.buildDirectory.file('via-libs/Cylox-ViaVersion-5.12.3-SNAPSHOT-java8.jar').get().asFile,
        url: 'https://ci.viaversion.com/job/ViaVersion-Java8/55/artifact/build/libs/ViaVersion-5.12.3-SNAPSHOT-downgraded.jar',
        requiredClass: 'com/viaversion/viaversion/api/protocol/version/ProtocolVersion.class'
    ],
    [
        file: layout.buildDirectory.file('via-libs/Cylox-ViaBackwards-5.12.3-SNAPSHOT-java8.jar').get().asFile,
        url: 'https://ci.viaversion.com/view/ViaBackwards/job/ViaBackwards-Java8/45/artifact/build/libs/ViaBackwards-5.12.3-SNAPSHOT-downgraded.jar',
        requiredClass: 'com/viaversion/viabackwards/api/ViaBackwardsPlatform.class'
    ],
    [
        file: layout.buildDirectory.file('via-libs/Cylox-ViaRewind-4.2.1-SNAPSHOT-398-java8.jar').get().asFile,
        url: 'https://ci.viaversion.com/view/ViaRewind/job/ViaRewind-Java8/40/artifact/build/libs/ViaRewind-4.2.1-SNAPSHOT-downgraded.jar',
        requiredClass: 'com/viaversion/viarewind/api/ViaRewindPlatform.class'
    ]
]
def viaLibraryFiles = files(viaJava8Libraries.collect { it.file })

tasks.register('downloadViaLibraries') {
    outputs.files(viaLibraryFiles)
    doLast {
        viaJava8Libraries.each { artifact ->
            File destination = artifact.file
            if (!destination.isFile() || destination.length() < 1024L) {
                if (!destination.parentFile.isDirectory()
                    && !destination.parentFile.mkdirs()
                    && !destination.parentFile.isDirectory()) {
                    throw new GradleException("Could not create Via library directory: ${destination.parentFile}")
                }
                File temporary = new File(destination.parentFile, destination.name + '.part')
                try {
                    java.net.URLConnection connection = new URL(artifact.url).openConnection()
                    connection.setConnectTimeout(15000)
                    connection.setReadTimeout(60000)
                    connection.setRequestProperty('User-Agent', 'Cylox-Client-Build/1.4.0')
                    connection.getInputStream().withCloseable { input ->
                        temporary.withOutputStream { output -> output << input }
                    }
                    if (!temporary.isFile() || temporary.length() < 1024L) {
                        throw new GradleException("Downloaded Via library is empty or incomplete: ${artifact.url}")
                    }
                    if (destination.exists() && !destination.delete()) {
                        throw new GradleException("Could not replace Via library: ${destination}")
                    }
                    if (!temporary.renameTo(destination)) {
                        throw new GradleException("Could not finalize Via library: ${destination}")
                    }
                } finally {
                    if (temporary.exists()) temporary.delete()
                }
            }

            java.util.zip.ZipFile archive
            try {
                archive = new java.util.zip.ZipFile(destination)
            } catch (Exception invalidArchive) {
                throw new GradleException("Invalid Via Java 8 archive: ${destination}", invalidArchive)
            }
            try {
                if (archive.getEntry(artifact.requiredClass) == null) {
                    throw new GradleException("Required Via class is missing from ${destination}: ${artifact.requiredClass}")
                }
                def entries = archive.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    if (entry.isDirectory() || !entry.name.endsWith('.class')
                        || entry.name.startsWith('META-INF/versions/') || entry.name == 'module-info.class') continue
                    archive.getInputStream(entry).withCloseable { input ->
                        byte[] header = new byte[8]
                        int offset = 0
                        while (offset < header.length) {
                            int count = input.read(header, offset, header.length - offset)
                            if (count < 0) break
                            offset += count
                        }
                        if (offset != 8 || header[0] != (byte) 0xCA || header[1] != (byte) 0xFE
                            || header[2] != (byte) 0xBA || header[3] != (byte) 0xBE) {
                            throw new GradleException("Invalid class header in ${destination}:${entry.name}")
                        }
                        int major = ((header[6] & 0xFF) << 8) | (header[7] & 0xFF)
                        if (major > 52) {
                            throw new GradleException("Via archive is not Java 8 compatible (class major ${major}): ${destination}:${entry.name}")
                        }
                    }
                }
            } finally {
                archive.close()
            }
        }
    }
}

sourceSets {
    main { compileClasspath += viaLibraryFiles }
    minecraft189 {
        java {
            srcDir 'src/minecraft189/java'
            include '**/CyloxTweaker.java'
            include '**/CyloxClientTransformer.java'
            include '**/CyloxBackgroundHooks.java'
            include '**/CyloxProtocolBridge.java'
            include '**/CyloxUiHooks.java'
        }
        compileClasspath += sourceSets.main.output
        compileClasspath += viaLibraryFiles
    }
    verify {
        java.srcDir 'src/verify/java'
        compileClasspath += sourceSets.main.output
        compileClasspath += sourceSets.minecraft189.output
        compileClasspath += configurations.minecraft189CompileClasspath
        runtimeClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.minecraft189.output
        runtimeClasspath += configurations.minecraft189CompileClasspath
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    compileOnly viaLibraryFiles
    compileOnly 'io.netty:netty-all:4.0.23.Final'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    minecraft189CompileOnly('net.minecraft:launchwrapper:1.12') {
        transitive = false
    }
    minecraft189CompileOnly 'org.ow2.asm:asm-debug-all:5.0.3'
    minecraft189CompileOnly 'org.lwjgl.lwjgl:lwjgl:2.9.1'
    minecraft189CompileOnly 'io.netty:netty-all:4.0.23.Final'
}

tasks.named('compileMinecraft189Java') {
    dependsOn tasks.named('downloadViaLibraries')
    options.encoding = 'UTF-8'
}

tasks.named('compileJava') {
    dependsOn tasks.named('downloadViaLibraries')
    options.encoding = 'UTF-8'
}

tasks.named('compileTestJava') {
    options.encoding = 'UTF-8'
}

tasks.register('minecraft189AdapterJar', Jar) {
    dependsOn tasks.named('minecraft189Classes'), tasks.named('downloadViaLibraries')
    archiveBaseName = 'Cylox-Client-1.8.9'
    archiveVersion = project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from sourceSets.minecraft189.output
    from({ viaLibraryFiles.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
    }
    manifest {
        attributes(
            'Implementation-Title': 'Cylox Client 1.8.9',
            'Implementation-Version': project.version,
            'Client-Developer': 'dapdev',
            'TweakClass': 'dev.cylox.client.minecraft189.CyloxTweaker',
            'Minecraft-Version': '1.8.9',
            'Client-Architecture': 'Vanilla 1.8.9 Renderer + Native Terrain Traversal + Updated ViaRewind Equipment Handling + Background Hooks + Cylox UI',
            'Protocol-Selection': 'Manual UI',
            'Client-UI': 'Cylox Adaptive Translucent UI'
        )
    }
}

tasks.register('generateClientVersion') {
    dependsOn tasks.named('minecraft189AdapterJar')
    def outputFile = layout.buildDirectory.file('generated/cylox/Cylox-1.8.9.json')
    outputs.file(outputFile)
    doLast {
        def releaseTag = "v${project.version}"
        def clientName = "Cylox-Client-1.8.9-${project.version}.jar"
        def vanillaMetadata = new groovy.json.JsonSlurper().parse(file('src/main/resources/vanilla-1.8.9.json'))
        def minecraftDownload = vanillaMetadata.downloads?.client
        if (vanillaMetadata.id != '1.8.9' || minecraftDownload == null || vanillaMetadata.assetIndex == null) {
            throw new GradleException('Bundled vanilla 1.8.9 metadata is incomplete')
        }
        def minecraftArtifact = [
            path: 'com/mojang/minecraft/1.8.9/minecraft-1.8.9-client.jar',
            sha1: minecraftDownload.sha1,
            size: minecraftDownload.size,
            url: minecraftDownload.url
        ]
        def libraries = [
            [name: 'com.mojang:minecraft:1.8.9:client', downloads: [artifact: minecraftArtifact]]
        ] + (vanillaMetadata.libraries ?: []) + [
            [name: 'net.minecraft:launchwrapper:1.12', url: 'https://libraries.minecraft.net/'],
            [name: 'org.ow2.asm:asm-debug-all:5.0.3', url: 'https://repo.maven.apache.org/maven2/'],
            [name: "dev.cylox:client:${project.version}", downloads: [artifact: [
                path: "dev/cylox/client/${project.version}/${clientName}",
                url: "https://github.com/dap144p/Cylox-Clients/releases/download/${releaseTag}/${clientName}"
            ]]]
        ]
        def versionData = [
            id: 'Cylox-1.8.9',
            name: 'Cylox Client 1.8.9',
            time: vanillaMetadata.time,
            releaseTime: vanillaMetadata.releaseTime,
            type: 'release',
            assets: vanillaMetadata.assets,
            assetIndex: vanillaMetadata.assetIndex,
            logging: vanillaMetadata.logging,
            mainClass: 'net.minecraft.launchwrapper.Launch',
            minimumLauncherVersion: 14,
            minecraftArguments: '--username ${auth_player_name} --version ${version_name} --gameDir ${game_directory} --assetsDir ${assets_root} --assetIndex ${assets_index_name} --uuid ${auth_uuid} --accessToken ${auth_access_token} --userProperties ${user_properties} --userType ${user_type} --tweakClass dev.cylox.client.minecraft189.CyloxTweaker',
            libraries: libraries
        ]
        if (versionData.containsKey('inheritsFrom') || versionData.containsKey('jar')) {
            throw new GradleException('Cylox version profile must not depend on a pre-installed parent version')
        }
        if (!libraries.any { it.name == 'com.mojang:minecraft:1.8.9:client' }) {
            throw new GradleException('Vanilla Minecraft 1.8.9 client artifact is missing from the classpath')
        }
        if (!libraries.any { it.name == "dev.cylox:client:${project.version}" }) {
            throw new GradleException('Cylox client artifact is missing from the classpath')
        }
        def output = outputFile.get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(versionData)) + '\n'
    }
}

tasks.register('buildClientPackage', Zip) {
    dependsOn tasks.named('minecraft189AdapterJar'), tasks.named('generateClientVersion')
    archiveBaseName = 'Cylox-Client-1.8.9'
    archiveVersion = project.version
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.file('generated/cylox/Cylox-1.8.9.json')) {
        into 'versions/Cylox-1.8.9'
    }
    from(tasks.named('minecraft189AdapterJar').flatMap { it.archiveFile }) {
        into "libraries/dev/cylox/client/${project.version}"
    }
    from('LICENSE') { into 'licenses' }
    from('THIRD_PARTY_NOTICES.md') { into 'licenses' }
    from('INSTALLATION.md') { rename { 'CYLOX-INSTALL.txt' } }
}

tasks.register('verifyVanilla189Hooks', JavaExec) {
    dependsOn tasks.named('verifyClasses')
    mainClass = 'dev.cylox.client.verify.Vanilla189Verifier'
    classpath = sourceSets.verify.runtimeClasspath
    doFirst {
        def vanillaJar = providers.gradleProperty('vanilla189Jar').orNull
        if (vanillaJar == null) throw new GradleException('Pass -Pvanilla189Jar=/path/to/1.8.9.jar')
        args = [vanillaJar]
    }
}

jar {
    archiveBaseName = 'Cylox-Client-Core'
    manifest {
        attributes(
            'Implementation-Title': 'Cylox Client Core',
            'Implementation-Version': project.version,
            'Built-For-Minecraft': '1.8.9',
            'Client-Developer': 'dapdev'
        )
    }
}
