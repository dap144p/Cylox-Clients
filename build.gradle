plugins {
    id 'java'
}

group = 'dev.cylox'
version = findProperty('cyloxVersion') ?: '0.2.2-alpha'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
    maven {
        name = 'minecraftLibraries'
        url = uri('https://libraries.minecraft.net/')
    }
}

dependencies {
    compileOnly 'net.minecraft:launchwrapper:1.12'
    compileOnly 'org.ow2.asm:asm-all:5.0.3'
    testImplementation 'net.minecraft:launchwrapper:1.12'
    testImplementation 'org.ow2.asm:asm-all:5.0.3'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all']
}

tasks.named('jar', Jar) {
    archiveBaseName.set('Cylox-Client-Core')
    manifest {
        attributes(
            'Implementation-Title': 'Cylox Client Core',
            'Implementation-Version': project.version,
            'Cylox-Minecraft-Version': '1.8.9'
        )
    }
}

test {
    useJUnit()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.register('buildClientPackage') {
    group = 'distribution'
    description = 'Builds the vanilla 1.8.9 version-folder package for Cylox Client.'
    dependsOn tasks.named('jar')

    doLast {
        def clientVersion = project.version.toString()
        def coreJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def packageDir = file("$buildDir/cylox-package")
        def distributionDir = file("$buildDir/distributions")
        def zipFile = new File(distributionDir, "Cylox-Client-Vanilla-1.8.9-${clientVersion}.zip")
        def libraryPath = "dev/cylox/cylox-client-core/${clientVersion}/cylox-client-core-${clientVersion}.jar"
        delete packageDir, zipFile
        packageDir.mkdirs()
        distributionDir.mkdirs()

        def sha1 = java.security.MessageDigest.getInstance('SHA-1')
            .digest(coreJar.bytes)
            .collect { String.format('%02x', it & 0xff) }
            .join()
        def timestamp = new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC'))

        def versionJson = '''{
  "id": "Cylox-1.8.9",
  "time": "@@TIMESTAMP@@",
  "releaseTime": "@@TIMESTAMP@@",
  "type": "release",
  "mainClass": "net.minecraft.launchwrapper.Launch",
  "minimumLauncherVersion": 18,
  "inheritsFrom": "1.8.9",
  "jar": "1.8.9",
  "minecraftArguments": "--username ${auth_player_name} --version ${version_name} --gameDir ${game_directory} --assetsDir ${assets_root} --assetIndex ${assets_index_name} --uuid ${auth_uuid} --accessToken ${auth_access_token} --userProperties ${user_properties} --userType ${user_type} --tweakClass dev.cylox.launch.CyloxTweaker",
  "libraries": [
    {
      "name": "net.minecraft:launchwrapper:1.12",
      "url": "https://libraries.minecraft.net/"
    },
    {
      "name": "org.ow2.asm:asm-all:5.0.3"
    },
    {
      "name": "dev.cylox:cylox-client-core:@@VERSION@@",
      "downloads": {
        "artifact": {
          "path": "dev/cylox/cylox-client-core/@@VERSION@@/cylox-client-core-@@VERSION@@.jar",
          "sha1": "@@CORE_SHA1@@",
          "size": @@CORE_SIZE@@,
          "url": "https://github.com/dap144p/Cylox-Clients/releases/download/v@@VERSION@@/Cylox-Client-Core-@@VERSION@@.jar"
        }
      }
    }
  ]
}'''
            .replace('@@TIMESTAMP@@', timestamp)
            .replace('@@VERSION@@', clientVersion)
            .replace('@@CORE_SHA1@@', sha1)
            .replace('@@CORE_SIZE@@', coreJar.length().toString())

        def versionDir = new File(packageDir, 'Cylox-1.8.9')
        versionDir.mkdirs()
        new File(versionDir, 'Cylox-1.8.9.json').setText(versionJson + System.lineSeparator(), 'UTF-8')

        // The ZIP contains exactly one folder for direct placement in .minecraft/versions.
        // Runtime dependencies are fetched by the launcher from the version metadata.
        ant.zip(destfile: zipFile.absolutePath, basedir: packageDir.absolutePath)
        logger.lifecycle("Cylox package created: ${zipFile}")
        logger.lifecycle("Core SHA-1: ${sha1}")
    }
}
