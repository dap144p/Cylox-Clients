plugins {
    id 'java'
}

group = 'dev.cylox'
version = '0.2.0'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
}

sourceSets {
    minecraft189 {
        java.srcDir 'src/minecraft189/java'
        compileClasspath += sourceSets.main.output
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    minecraft189CompileOnly files(findProperty('mc189Jar') ?: 'libs/minecraft-1.8.9-mcp.jar')
}

compileJava {
    options.encoding = 'UTF-8'
}

tasks.named('compileMinecraft189Java') {
    options.encoding = 'UTF-8'
}

tasks.register('minecraft189AdapterJar', Jar) {
    dependsOn tasks.named('minecraft189Classes')
    archiveBaseName = 'Cylox-1.8.9-GameAdapter'
    from sourceSets.main.output
    from sourceSets.minecraft189.output
}

jar {
    archiveBaseName = 'Cylox-UI-Core'
    manifest {
        attributes(
            'Implementation-Title': 'Cylox Client UI Core',
            'Implementation-Version': project.version,
            'Built-For-Minecraft': '1.8.9',
            'Client-Developer': 'dapdev'
        )
    }
}
