name: Build Cylox Background Client — 1.8.9

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: Test, verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download official Minecraft 1.8.9 for hook verification
        shell: bash
        run: |
          set -euo pipefail
          VANILLA_JAR="$RUNNER_TEMP/vanilla-1.8.9.jar"
          curl --fail --location --retry 3 \
            https://launcher.mojang.com/v1/objects/3870888a6c3d349d3771a3e9d16c9bf5e076b908/client.jar \
            --output "$VANILLA_JAR"
          echo "3870888a6c3d349d3771a3e9d16c9bf5e076b908  $VANILLA_JAR" | sha1sum --check

      - name: Run tests, compile, package and verify vanilla hooks
        run: gradle --no-daemon clean test buildClientPackage verifyVanilla189Hooks -Pvanilla189Jar="$RUNNER_TEMP/vanilla-1.8.9.jar"

      - name: Verify standalone MJ Launcher profile and ZIP layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          import re
          version = re.search(r"^version = '([^']+)'", pathlib.Path("build.gradle").read_text(encoding="utf-8"), re.MULTILINE).group(1)
          profile_path = pathlib.Path("build/generated/cylox/Cylox-1.8.9.json")
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          assert "inheritsFrom" not in profile, "profile must not require a parent version"
          assert "jar" not in profile, "profile must not alias a missing parent JAR"
          assert profile.get("assets") == "1.8" and profile.get("assetIndex"), "missing official assets metadata"
          assert "${assets_index_name}" in profile.get("minecraftArguments", ""), "wrong legacy asset-index placeholder"
          libraries = {item.get("name"): item for item in profile.get("libraries", [])}
          minecraft = libraries.get("com.mojang:minecraft:1.8.9:client")
          assert minecraft, "missing vanilla Minecraft client library"
          artifact = minecraft.get("downloads", {}).get("artifact", {})
          assert artifact.get("sha1") == "3870888a6c3d349d3771a3e9d16c9bf5e076b908", "unexpected vanilla client SHA-1"
          assert artifact.get("path") == "com/mojang/minecraft/1.8.9/minecraft-1.8.9-client.jar"
          cylox = libraries.get(f"dev.cylox:client:{version}")
          assert cylox, "missing Cylox library entry"
          expected_cylox_path = f"dev/cylox/client/{version}/Cylox-Client-1.8.9-{version}.jar"
          assert cylox.get("downloads", {}).get("artifact", {}).get("path") == expected_cylox_path

          package_path = pathlib.Path(f"build/distributions/Cylox-Background-Client-1.8.9-{version}.zip")
          with zipfile.ZipFile(package_path) as archive:
              names = set(archive.namelist())
          assert "versions/Cylox-1.8.9/Cylox-1.8.9.json" in names
          assert f"libraries/{expected_cylox_path}" in names, "Cylox JAR is not in its declared library path"
          print("[Cylox] Standalone version metadata and dependency paths verified.")
          PY

      - name: Enforce single embedded client JAR
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^version = '\\(.*\\)'/\\1/p" build.gradle | head -n1)"
          JAR="build/libs/Cylox-Client-1.8.9-${VERSION}.jar"
          test -s "$JAR"
          SIZE="$(stat -c%s "$JAR")"
          echo "Embedded Cylox client JAR size: $SIZE bytes"
          test "$SIZE" -lt 20000000
          if unzip -l "$JAR" | grep -Eq '(^|/)(ViaVersion|ViaBackwards|ViaRewind)-[^/]*\.jar$'; then
            echo "Unexpected external Via JAR nested inside client archive"
            exit 1
          fi
          unzip -l "$JAR" | grep -q 'com/viaversion/viaversion/api/protocol/version/ProtocolVersion.class'
          unzip -l "$JAR" | grep -q 'com/viaversion/viabackwards/api/ViaBackwardsPlatform.class'

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: Cylox-Background-Client-1.8.9
          path: |
            build/libs/Cylox-Client-1.8.9-*.jar
            build/distributions/Cylox-Background-Client-1.8.9-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned and latest releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^version = '\\(.*\\)'/\\1/p" build.gradle | head -n1)"
          TAG="v${VERSION}"
          JAR="build/libs/Cylox-Client-1.8.9-${VERSION}.jar"
          ZIP="build/distributions/Cylox-Background-Client-1.8.9-${VERSION}.zip"
          test -s "$JAR"
          test -s "$ZIP"

          NOTES="$(cat <<EOF
          Cylox Client ${VERSION} — lightweight Minecraft Java 1.8.9 background client.

          - The Cylox client and ViaVersion, ViaBackwards and ViaRewind protocol features are bundled into ONE JAR.
          - The standalone profile declares Minecraft 1.8.9's official client artifact, libraries and asset index as launcher dependencies; a separate vanilla profile is not required when the launcher resolves legacy libraries correctly.
          - Choose the target server protocol manually using the Via selector on the Multiplayer screen; selection is saved in the game directory.
          - No automatic server-version detection or status-ping protocol selection.
          - Automatically skips vanilla rendering while the LWJGL display is inactive or hidden.
          - Completely skips the vanilla EntityRenderer frame while the display is inactive or hidden, reducing world rendering to 0 FPS.
          - Keeps the whole Minecraft main loop at 20 Hz in the background. The loop is not capped at 2 FPS because Display.sync throttles client ticks and packet-task processing as well as rendering.
          - No anti-AFK, auto-clicker, movement automation, HUD, Click GUI, Forge or Fabric.
          - Minecraft, Java runtime, renderer, assets and base game libraries are downloaded or supplied by the launcher; they are not merged into the Cylox JAR.
          - Developer: dapdev. License: GPL-3.0-or-later.

          Android may pause or terminate a background process. A real MJ Launcher/device smoke test is required before treating background connectivity as guaranteed.
          EOF
          )"

          ASSETS=("$JAR" "$ZIP")

          # gh release upload --clobber can still race with an existing asset
          # on repeated workflow runs. Delete exact-name matches first.
          upload_release_assets() {
            local release="$1"
            local path asset
            for path in "${ASSETS[@]}"; do
              asset="${path##*/}"
              if gh release view "$release" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
                gh release delete-asset "$release" "$asset" --yes
              fi
            done
            gh release upload "$release" "${ASSETS[@]}"
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Cylox Background Client ${VERSION} — 1.8.9" --notes "$NOTES"
            upload_release_assets "$TAG"
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "Cylox Background Client ${VERSION} — 1.8.9" --notes "$NOTES"
          fi

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Cylox Background Client latest — 1.8.9" --notes "$NOTES"
            # Keep only the current version's JAR and launcher package.
            while IFS= read -r asset; do
              keep=0
              for path in "${ASSETS[@]}"; do
                if [[ "$asset" == "${path##*/}" ]]; then keep=1; break; fi
              done
              if [[ "$keep" -eq 0 ]]; then
                gh release delete-asset latest "$asset" --yes
              fi
            done < <(gh release view latest --json assets --jq '.assets[].name')
            upload_release_assets latest
          else
            gh release create latest "${ASSETS[@]}" --title "Cylox Background Client latest — 1.8.9" --notes "$NOTES"
          fi
