name: Build Cylox Client — Vanilla 1.8.9

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'README.md'
      - 'INSTALLATION.md'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and package Cylox Client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run tests and build vanilla package
        run: gradle clean test buildClientPackage --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cylox-Client-Vanilla-1.8.9
          path: |
            build/libs/Cylox-Client-Core-*.jar
            build/distributions/Cylox-Client-Vanilla-1.8.9-*.zip
          if-no-files-found: error

      - name: Publish versioned and latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^cyloxVersion=' gradle.properties | cut -d '=' -f 2-)"
          TAG="v$VERSION"
          ZIP="build/distributions/Cylox-Client-Vanilla-1.8.9-$VERSION.zip"
          CORE="build/libs/Cylox-Client-Core-$VERSION.jar"
          test -s "$ZIP"
          test -s "$CORE"

          NOTES="$(cat <<EOF
          Cylox Client $VERSION — Vanilla 1.8.9 runtime foundation.

          - Minecraft Java Edition: 1.8.9
          - Runtime: vanilla-based bootstrap; no Forge/Fabric runtime
          - Developer: dapdev
          - Includes a version-folder ZIP and the Cylox Client Core library
          - The original Minecraft client JAR is not redistributed

          This alpha validates the bootstrap and transformer pipeline. The custom in-game UI and gameplay modules are still under development.
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Cylox Client $VERSION — Vanilla 1.8.9" --notes "$NOTES" --prerelease
            gh release upload "$TAG" "$ZIP" "$CORE" --clobber
          else
            gh release create "$TAG" "$ZIP" "$CORE" --title "Cylox Client $VERSION — Vanilla 1.8.9" --notes "$NOTES" --prerelease
          fi

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Cylox Client latest — Vanilla 1.8.9" --notes "$NOTES" --prerelease
            while IFS= read -r asset; do
              case "$asset" in
                *Forge*|*Installer*)
                  gh release delete-asset latest "$asset" --yes || true
                  ;;
              esac
            done < <(gh release view latest --json assets --jq '.assets[].name')
            gh release upload latest "$ZIP" "$CORE" --clobber
          else
            gh release create latest "$ZIP" "$CORE" --title "Cylox Client latest — Vanilla 1.8.9" --notes "$NOTES" --prerelease
          fi
