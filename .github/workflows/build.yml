name: Build Cylox Client and Installer

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'README.md'
      - 'INSTALLATION.md'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'buildSrc/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build:
    name: Build Cylox Client and Android JAR Installer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'
      - name: Build Forge 1.8.9 client
        run: gradle setupDecompWorkspace build --no-daemon
      - name: Build standalone installer JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/installer-classes build/installer
          javac -source 8 -target 8 -encoding UTF-8 -d build/installer-classes installer/src/main/java/dev/cylox/installer/CyloxInstaller.java
          printf 'Main-Class: dev.cylox.installer.CyloxInstaller\n' > build/installer/MANIFEST.MF
          jar cfm build/installer/Cylox-Client-Installer.jar build/installer/MANIFEST.MF -C build/installer-classes .
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cylox-Client-Android-JARs
          path: |
            build/libs/*.jar
            build/installer/Cylox-Client-Installer.jar
          if-no-files-found: error
      - name: Publish versioned and latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | sort | head -n 1)"
          test -n "$SOURCE_JAR"
          VERSION="$(grep '^version' build.gradle | head -n 1 | cut -d "'" -f 2)"
          TAG="v$VERSION"
          VERSIONED_JAR="build/libs/Cylox-Client-Forge-1.8.9-$VERSION.jar"
          cp "$SOURCE_JAR" "$VERSIONED_JAR"
          INSTALLER="build/installer/Cylox-Client-Installer.jar"
          NOTES="Cylox Client $VERSION

          Minecraft: Java Edition 1.8.9
          Forge: 11.15.1.2318
          Developer: dapdev

          Client mod JAR and Android/MJ Launcher installer are attached."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Cylox Client $VERSION" --notes "$NOTES" --prerelease
            gh release upload "$TAG" "$VERSIONED_JAR" --clobber
          else
            gh release create "$TAG" "$VERSIONED_JAR" --title "Cylox Client $VERSION" --notes "$NOTES" --prerelease
          fi
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Cylox Client latest — Forge 1.8.9" --notes "$NOTES" --prerelease
            gh release upload latest "$VERSIONED_JAR" "$INSTALLER" --clobber
          else
            gh release create latest "$VERSIONED_JAR" "$INSTALLER" --title "Cylox Client latest — Forge 1.8.9" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" "$INSTALLER" --clobber
