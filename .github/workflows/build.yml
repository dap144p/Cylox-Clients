name: Build Cylox Client — Vanilla 1.8.9

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile, test, verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download official Minecraft 1.8.9 for bytecode verification
        shell: bash
        run: |
          set -euo pipefail
          VANILLA_JAR="$RUNNER_TEMP/vanilla-1.8.9.jar"
          curl --fail --location --retry 3 \
            https://launcher.mojang.com/v1/objects/3870888a6c3d349d3771a3e9d16c9bf5e076b908/client.jar \
            --output "$VANILLA_JAR"
          echo "3870888a6c3d349d3771a3e9d16c9bf5e076b908  $VANILLA_JAR" | sha1sum --check

      - name: Test, build and verify vanilla bytecode hooks
        run: gradle --no-daemon clean test buildClientPackage verifyVanilla189Hooks -Pvanilla189Jar="$RUNNER_TEMP/vanilla-1.8.9.jar"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: Cylox-Client-Vanilla-1.8.9
          path: |
            build/libs/Cylox-Client-1.8.9-*.jar
            build/libs/Cylox-UI-Core-*.jar
            build/distributions/Cylox-Client-Vanilla-1.8.9-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned and latest releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^version = '\\(.*\\)'/\\1/p" build.gradle | head -n1)"
          TAG="v${VERSION}"
          JAR="build/libs/Cylox-Client-1.8.9-${VERSION}.jar"
          ZIP="build/distributions/Cylox-Client-Vanilla-1.8.9-${VERSION}.zip"
          test -s "$JAR"
          test -s "$ZIP"

          NOTES="$(cat <<EOF
          Cylox Client ${VERSION} — Standalone Vanilla Minecraft Java 1.8.9.

          - Vanilla base; no Forge or Fabric required.
          - Lightweight LWJGL/OpenGL Click GUI and HUD with Watermark/FPS/Keystrokes/custom crosshair.
          - Module keybind toggles are edge-triggered; module states, keybinds and settings persist in the game directory.
          - ToggleSprint holds the vanilla sprint keybinding while enabled.
          - Protocol core includes the protocol catalogue, VarInt codec, handshake encoder and bidirectional translator extension point.
          - Server version detection uses the standard Minecraft status ping and reads the advertised protocol ID.
          - Native gameplay compatibility remains protocol 47 (Minecraft 1.8.x). Detecting newer protocols does not make them playable; translators are still required.
          - Does not redistribute Minecraft, assets, natives, or game libraries.
          - Developer: dapdev.

          Other movement and combat modules plus newer-protocol translation are not included in this build. MJ Launcher device smoke testing is still required.
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Cylox Client ${VERSION} — Vanilla 1.8.9" --notes "$NOTES" --prerelease
            gh release upload "$TAG" "$JAR" "$ZIP" --clobber
          else
            gh release create "$TAG" "$JAR" "$ZIP" --title "Cylox Client ${VERSION} — Vanilla 1.8.9" --notes "$NOTES" --prerelease
          fi

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Cylox Client latest — Vanilla 1.8.9" --notes "$NOTES" --prerelease
            while IFS= read -r asset; do
              case "$asset" in
                "${JAR##*/}"|"${ZIP##*/}")
                  ;;
                *)
                  gh release delete-asset latest "$asset" --yes || true
                  ;;
              esac
            done < <(gh release view latest --json assets --jq '.assets[].name')
            gh release upload latest "$JAR" "$ZIP" --clobber
          else
            gh release create latest "$JAR" "$ZIP" --title "Cylox Client latest — Vanilla 1.8.9" --notes "$NOTES" --prerelease
          fi
