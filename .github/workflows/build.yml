name: Build Cylox Client

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ui-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and test UI core
        run: gradle --no-daemon clean build

      - name: Upload UI core JAR
        uses: actions/upload-artifact@v4
        with:
          name: cylox-ui-core-0.3.0
          path: build/libs/Cylox-UI-Core-0.3.0.jar
          if-no-files-found: error
          retention-days: 30
