name: Build Cylox Client

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'buildSrc/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Keep only the newest build for a branch. This prevents overlapping builds
# from commits pushed in quick succession.
concurrency:
  group: cylox-client-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Forge 1.8.9 client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Build Forge 1.8.9 client
        run: gradle setupDecompWorkspace build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Cylox-Client-Forge-1.8.9
          path: build/libs/*.jar
          if-no-files-found: error
