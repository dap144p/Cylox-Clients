name: Build Cylox Client

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'README.md'
      - 'INSTALLATION.md'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'buildSrc/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Keep only the newest build for a branch. This prevents overlapping builds
# from commits pushed in quick succession.
concurrency:
  group: cylox-client-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Forge 1.8.9 client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Build Forge 1.8.9 client
        run: gradle setupDecompWorkspace build --no-daemon

      - name: Upload versioned JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cylox-Client-Forge-1.8.9
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish rolling latest JAR release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | sort | head -n 1)"
          test -n "$SOURCE_JAR"
          STABLE_JAR="build/libs/Cylox-Client-latest-Forge-1.8.9.jar"
          cp "$SOURCE_JAR" "$STABLE_JAR"

          # Move the rolling tag to this successfully built commit.
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

          BUILD_FILE="$(basename "$SOURCE_JAR")"
          NOTES="Automatically updated from the latest successful build on main.

          Developer: dapdev
          Minecraft: Java Edition 1.8.9
          Loader: Forge 11.15.1.2318
          Build JAR: $BUILD_FILE

          This is an early alpha build. See INSTALLATION.md for setup and known limitations."
          RELEASE_TITLE="Cylox Client latest — Forge 1.8.9"

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "$RELEASE_TITLE" --notes "$NOTES" --prerelease
            gh release upload latest "$STABLE_JAR" --clobber
          else
            gh release create latest "$STABLE_JAR" --title "$RELEASE_TITLE" --notes "$NOTES" --prerelease
          fi
