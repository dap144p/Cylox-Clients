name: Build Cylox Background Client — 1.8.9

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: Test, verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download official Minecraft 1.8.9 for hook verification
        shell: bash
        run: |
          set -euo pipefail
          VANILLA_JAR="$RUNNER_TEMP/vanilla-1.8.9.jar"
          curl --fail --location --retry 3 \
            https://launcher.mojang.com/v1/objects/3870888a6c3d349d3771a3e9d16c9bf5e076b908/client.jar \
            --output "$VANILLA_JAR"
          echo "3870888a6c3d349d3771a3e9d16c9bf5e076b908  $VANILLA_JAR" | sha1sum --check

      - name: Run tests, compile, package and verify vanilla hooks
        run: gradle --no-daemon clean test buildClientPackage verifyVanilla189Hooks -Pvanilla189Jar="$RUNNER_TEMP/vanilla-1.8.9.jar"

      - name: Enforce small client JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name 'Cylox-Client-1.8.9-*.jar' -print -quit)"
          test -n "$JAR"
          SIZE="$(stat -c%s "$JAR")"
          echo "Cylox client JAR size: $SIZE bytes"
          test "$SIZE" -lt 5000000

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: Cylox-Background-Client-1.8.9
          path: |
            build/libs/Cylox-Client-1.8.9-*.jar
            build/distributions/Cylox-Background-Client-1.8.9-*.zip
            build/via-libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned and latest releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^version = '\\(.*\\)'/\\1/p" build.gradle | head -n1)"
          TAG="v${VERSION}"
          JAR="build/libs/Cylox-Client-1.8.9-${VERSION}.jar"
          ZIP="build/distributions/Cylox-Background-Client-1.8.9-${VERSION}.zip"
          VIA_VERSION="build/via-libs/Cylox-ViaVersion-5.12.1.jar"
          VIA_BACKWARDS="build/via-libs/Cylox-ViaBackwards-5.12.1.jar"
          VIA_REWIND="build/via-libs/Cylox-ViaRewind-4.2.0.jar"
          test -s "$JAR"
          test -s "$ZIP"

          NOTES="$(cat <<EOF
          Cylox Client ${VERSION} — lightweight Minecraft Java 1.8.9 background client.

          - Automatically skips the vanilla renderer while the LWJGL display is inactive or hidden.
          - Limits the background frame loop to 5 FPS; foreground rendering returns to the launcher's selected renderer and normal frame limit.
          - Keeps the normal Minecraft networking/tick loop alive while the launcher process remains active.
          - No anti-AFK, auto-clicker, movement automation, HUD, Click GUI, Forge or Fabric.
          - Optional client-side protocol translation is provided by separate ViaVersion/ViaBackwards/ViaRewind libraries; tested catalogue in README.
          - Client adapter JAR is a standalone small file; Minecraft, Java, renderer, assets and base libraries are not bundled.
          - Developer: dapdev. License: GPL-3.0-or-later.

          Android may pause or terminate a background process. The JAR cannot override Android or launcher lifecycle policy; a live MJ Launcher smoke test is still required.
          EOF
          )"

          ASSETS=("$JAR" "$ZIP")
          for DEP in "$VIA_VERSION" "$VIA_BACKWARDS" "$VIA_REWIND"; do
            if test -s "$DEP"; then ASSETS+=("$DEP"); fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Cylox Background Client ${VERSION} — 1.8.9" --notes "$NOTES"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "Cylox Background Client ${VERSION} — 1.8.9" --notes "$NOTES"
          fi

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Cylox Background Client latest — 1.8.9" --notes "$NOTES"
            gh release upload latest "${ASSETS[@]}" --clobber
          else
            gh release create latest "${ASSETS[@]}" --title "Cylox Background Client latest — 1.8.9" --notes "$NOTES"
          fi
